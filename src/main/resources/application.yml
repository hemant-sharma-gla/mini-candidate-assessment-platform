spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  datasource:
    url: jdbc:postgresql://localhost:5433/candidate_assessment
    username: postgres
    password: postgres
  #    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: your_jwt_secret_key_here_make_it_long_and_secure_in_production
  expiration: 86400000L

server:
  port: 8080